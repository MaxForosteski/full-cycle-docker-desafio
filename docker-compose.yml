services:
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
     - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - node-network
    depends_on:
      - nodeapp
    
  nodeapp:
    build: 
      context: ./node_app
    container_name: node_app
    volumes:
      - ./node_app:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - db
    tty: true
    environment:
      - MYSQL_HOST=db
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root
      - MYSQL_DATABASE=nodedb
    networks:
      - node-network

  db:
      image: mysql:8.0
      command: --default-authentication-plugin=mysql_native_password
      container_name: mysql_db
      restart: always
      environment:
        MYSQL_DATABASE: nodedb
        MYSQL_ROOT_PASSWORD: root
      networks:
        - node-network
      volumes:
        - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      tty: true

networks:
  node-network:
    driver: bridge